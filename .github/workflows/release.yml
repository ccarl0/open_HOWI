name: installers

# Builds the installers on every change to the packaging (so they are known to work) and, for a
# version tag (v0.1.0, ...), publishes them as a GitHub release:
#   - Windows: open_HOWI-<version>-windows-setup.exe (Inno Setup) and a portable .zip
#   - macOS (Apple silicon): open_HOWI-<version>-macos-arm64.dmg
#   - Linux (x86-64): open_HOWI-<version>-linux-x86_64.tar.gz with install.sh
#   - Python: the wheel and source package, for `pipx install`

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "src/openhowi/desktop.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: macos-latest, name: macos-arm64 }
          - { os: ubuntu-22.04, name: linux-x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux libraries for the app window (Qt WebEngine) and a virtual screen to test it on
        if: runner.os == 'Linux'
        # A stalled package mirror otherwise holds the job for hours: give up and say so instead.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo -E apt-get $apt update -qq
          sudo -E apt-get $apt install -y -qq xvfb libegl1 libgl1 libnss3 libxkbcommon0 libxkbcommon-x11-0 libxcomposite1 \
            libxdamage1 libxrandr2 libgbm1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxtst6 libxshmfence1 libdbus-1-3 \
            libfontconfig1 libxkbfile1
      - name: Install open_HOWI and PyInstaller
        shell: bash
        run: |
          extra=""
          if [ "$RUNNER_OS" = "Linux" ]; then extra="[window]"; fi
          python -m pip install ".$extra" "pyinstaller>=6.11,<7"
      - name: Version
        id: version
        shell: bash
        run: |
          version=$(python -c "import openhowi; print(openhowi.__version__)")
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the package version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the app
        run: python -m PyInstaller --noconfirm --clean packaging/open_HOWI.spec
      - name: Leave out the parts of Qt the window does not use
        if: runner.os == 'Linux'
        run: python packaging/linux/prune_qt.py dist/open_HOWI
      - name: Check the app works
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then folder=dist/open_HOWI.app/Contents/MacOS; else folder=dist/open_HOWI; fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1600x1000x24" python packaging/smoke_test.py "$folder" --window
          else
            python packaging/smoke_test.py "$folder"
          fi
      - name: Open the app window (best effort on this runner)
        if: runner.os != 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then folder=dist/open_HOWI.app/Contents/MacOS; else folder=dist/open_HOWI; fi
          python packaging/smoke_test.py "$folder" --window

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} packaging\windows\open_HOWI.iss
          Compress-Archive -Path dist\open_HOWI -DestinationPath dist\open_HOWI-${{ steps.version.outputs.version }}-windows-portable.zip
          New-Item -ItemType Directory -Force out | Out-Null
          Move-Item dist\open_HOWI-*-windows-*.* out\
      - name: Install it as a user would and open the app window from there
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "open HOWI installed"
          $setup = (Get-Item out\open_HOWI-*-windows-setup.exe).FullName
          $p = Start-Process $setup -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`""
          if ($p.ExitCode -ne 0) { throw "the installer failed ($($p.ExitCode))" }
          python packaging/smoke_test.py "$dir" --window
          # The publisher in the file details and in Apps & features
          $publisher = "Carlo Cecchetti"
          foreach ($file in @($setup, (Join-Path $dir "open_HOWI.exe"), (Join-Path $dir "openhowi.exe"))) {
            $company = (Get-Item $file).VersionInfo.CompanyName -replace '[\s\x00]+$', ''  # Inno pads it with spaces
            if ($company -ne $publisher) { throw "$file names '$company' as its publisher" }
          }
          $entry = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6E3C0F4B-9D5A-4C1E-8F2B-0A7D3E9B6C41}_is1"
          if ($entry.Publisher -ne $publisher) { throw "Apps & features names '$($entry.Publisher)' as the publisher" }
          Write-Output "publisher: $publisher (file details and Apps & features)"
      - name: macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          packaging/macos/make_dmg.sh out/open_HOWI-${{ steps.version.outputs.version }}-macos-arm64.dmg
      - name: Linux archive
        if: runner.os == 'Linux'
        run: |
          name=open_HOWI-${{ steps.version.outputs.version }}-linux-x86_64
          mkdir -p "stage/$name" out
          cp -R dist/open_HOWI "stage/$name/"
          cp packaging/linux/install.sh "stage/$name/"
          cp packaging/linux/README.txt "stage/$name/"
          cp packaging/icon-256.png "stage/$name/open_HOWI.png"
          tar -C stage -czf "out/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: open_HOWI-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  python:
    name: python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --outdir out
      - name: Check the wheel installs and runs
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install out/*.whl
          /tmp/venv/bin/openhowi naca 2412 -o /tmp/naca.dat
          /tmp/venv/bin/openhowi airfoils --export sd7037 -o /tmp/sd7037.dat
      - uses: actions/upload-artifact@v4
        with:
          name: open_HOWI-python
          path: out/*
          if-no-files-found: error

  release:
    name: publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [app, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          cat > notes.md <<'EOF'
          ## Download

          | Your computer | File | How |
          |---|---|---|
          | Windows 10/11 | `open_HOWI-…-windows-setup.exe` | Run it and follow the steps; start open_HOWI from the Start menu. Windows may warn about an unknown publisher: *More info → Run anyway*. A portable `.zip` is there too. |
          | Mac with Apple silicon | `open_HOWI-…-macos-arm64.dmg` | Open it and drag open_HOWI to Applications. The first time, right-click it and choose *Open* (the app is not signed by Apple). |
          | Linux (x86-64) | `open_HOWI-…-linux-x86_64.tar.gz` | Unpack it and run `./install.sh`; open_HOWI appears in your applications menu. (It carries its own web engine, hence the size.) |
          | Anything with Python 3.11+ (Intel Macs, Raspberry Pi, …) | `open_howi-…-py3-none-any.whl` | `pipx install <the .whl file>`, then `open-howi` (or `openhowi gui`). |

          open_HOWI opens in its own window and runs on your computer only. To run it on a Raspberry Pi next to the machine and use it from other computers, see the README.
          EOF
          # The tag may come from `git push` (no release yet) or from GitHub's "Draft a new release"
          # page, which publishes the release first: then add the files to it, and the notes if it
          # has none.
          tag="$GITHUB_REF_NAME"
          if body=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null); then
            gh release upload "$tag" out/* --repo "$GITHUB_REPOSITORY" --clobber
            if [[ -z "${body//[[:space:]]/}" ]]; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            fi
          else
            gh release create "$tag" out/* --repo "$GITHUB_REPOSITORY" --title "open_HOWI $tag" \
              --notes-file notes.md --generate-notes
          fi
